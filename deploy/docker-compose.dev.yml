services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ecd
      POSTGRES_PASSWORD: ecd_dev
      POSTGRES_DB: ecd
    ports:
      - "5432:5432"
    volumes:
      - ecd_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ecd_pg_data:
